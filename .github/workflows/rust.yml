name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Stay on 1.99.1. Rust 1.100 (LLVM 23.1.5, HIR-aware coverage spans)
      # attributes counters for untaken branches to source lines, including
      # closing braces and lines that are covered in a different generic
      # instantiation. The same tests are 100% lines on 1.99.1 and 99.86%
      # (26 missed lines) on 1.100. Do not move this job back to stable
      # until `cargo coverage` is 100% lines on that compiler. The gate
      # itself stays at 100%.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The gate lives in .cargo/config.toml so CI, humans and agents run
      # the same command: 100% line coverage, `*_io.rs` excluded.
      - name: Coverage gate
        run: cargo coverage

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            sandbox = false
            accept-flake-config = true
      - name: Check Nix formatting
        run: nix fmt -- --check .
      - name: Check flake
        run: nix flake check
      - name: Build with Nix
        run: nix build .#
      - name: Test the binary
        run: ./result/bin/portfolio_rs --help
