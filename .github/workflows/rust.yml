name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            accept-flake-config = true
      # The compiler comes from flake.lock, not the runner's rustup, so key
      # the cache on the lock.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: nix-${{ hashFiles('flake.lock') }}
      # Coverage numbers depend on the compiler, so the gate runs in the dev
      # shell: the toolchain and cargo-llvm-cov come from flake.lock, the same
      # ones humans and agents use locally. A new Rust arrives with the weekly
      # flake.lock update, which update-flake.yml measures before it opens the
      # pull request. The gate itself lives in .cargo/config.toml: 100% lines,
      # `*_io.rs` excluded.
      - name: Coverage gate
        run: nix develop -c cargo coverage

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            sandbox = false
            accept-flake-config = true
      - name: Check Nix formatting
        run: nix fmt -- --check .
      - name: Check flake
        run: nix flake check
      - name: Build with Nix
        run: nix build .#
      - name: Test the binary
        run: ./result/bin/portfolio_rs --help
